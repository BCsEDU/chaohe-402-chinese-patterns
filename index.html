<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>國語短語與句型教學網（第七課～第十二課）</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --primary: #1e40af;
    --primary-light: #dbeafe;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --font-scale: 1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* 頂部導覽列 */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1e3a8a;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .brand-badge {
    background: #fbbf24;
    color: #1e3a8a;
    font-weight: 900;
    font-size: 1.1rem;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .brand-title {
    font-size: 1.5rem;
    font-weight: 900;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.28);
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }

  /* 首頁選課區 */
  .hero-banner {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    border-radius: 20px;
    padding: 28px 34px;
    margin-bottom: 26px;
  }

  .hero-banner h1 {
    font-size: calc(2.1rem * var(--font-scale));
    font-weight: 900;
    margin-bottom: 6px;
  }

  .hero-banner p {
    font-size: calc(1.2rem * var(--font-scale));
    color: #dbeafe;
    font-weight: 600;
  }

  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 20px;
  }

  .lesson-card {
    background: var(--surface);
    border: 2.5px solid #cbd5e1;
    border-radius: 18px;
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: all 0.18s;
  }

  .lesson-card.ready {
    border-color: #3b82f6;
    cursor: pointer;
  }

  .lesson-card.ready:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(30, 64, 175, 0.14);
  }

  .lesson-card.locked {
    background: #f8fafc;
    border-style: dashed;
    opacity: 0.72;
  }

  .lesson-tag {
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 900;
    padding: 4px 14px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1e40af;
  }

  .status-pill {
    font-size: 0.98rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .status-pill.ready { background: #dcfce7; color: #15803d; }
  .status-pill.soon { background: #e2e8f0; color: #475569; }

  .lesson-name {
    font-size: calc(1.85rem * var(--font-scale));
    font-weight: 900;
    margin-top: 10px;
  }

  .lesson-desc {
    font-size: calc(1.12rem * var(--font-scale));
    color: var(--text-muted);
    font-weight: 600;
  }

  .start-btn {
    background: #1e40af;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
  }

  .lesson-card.locked .start-btn {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
  }

  /* 課程單頁教學畫面 */
  #lesson-view {
    display: none;
  }

  /* 頂部快速導覽列 */
  .quick-bar {
    background: #fff;
    border: 2.5px solid #cbd5e1;
    border-radius: 18px;
    padding: 16px 22px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .lesson-main-title {
    font-size: calc(1.75rem * var(--font-scale));
    font-weight: 900;
    color: #1e3a8a;
  }

  .jump-links {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .jump-btn {
    padding: 8px 16px;
    border-radius: 10px;
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 800;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: #1e293b;
    cursor: pointer;
    text-decoration: none;
  }

  .jump-btn:hover {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1e40af;
  }

  .jump-btn.text-toggle {
    background: #eff6ff;
    border-color: #93c5fd;
    color: #1e40af;
  }

  /* 課文全文收合面板（可隨時點開對照 1~7 自然段） */
  .fulltext-drawer {
    display: none;
    background: #fff;
    border: 2.5px solid #93c5fd;
    border-radius: 18px;
    padding: 22px 26px;
    margin-bottom: 24px;
  }

  .fulltext-drawer.open {
    display: block;
  }

  .para-line {
    display: flex;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: #f8fafc;
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 600;
  }

  .para-line.has-hl {
    background: #eff6ff;
    border-left: 5px solid #2563eb;
  }

  .para-num {
    flex-shrink: 0;
    font-weight: 900;
    color: #1e40af;
    min-width: 100px;
  }

  .hl-mark {
    background: #fef08a;
    color: #854d0e;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 6px;
  }

  /* 單一句型完整教學區塊（結構拆解 ＋ 3個情境練習一體成形） */
  .pattern-section {
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 22px;
    padding: 28px 30px;
    margin-bottom: 32px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    scroll-margin-top: 84px;
  }

  .pattern-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 2.5px solid #e2e8f0;
  }

  .pattern-title-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .pattern-num-badge {
    background: #1e40af;
    color: #fff;
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 900;
    padding: 6px 16px;
    border-radius: 10px;
  }

  .para-loc-badge {
    background: #fef3c7;
    color: #92400e;
    border: 2px solid #f59e0b;
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 999px;
  }

  .formula-title {
    width: 100%;
    font-size: calc(1.65rem * var(--font-scale));
    font-weight: 900;
    color: #1e3a8a;
    margin-top: 4px;
  }

  /* 課文自然段原句對照框 */
  .context-box {
    background: #f8fafc;
    border-left: 6px solid #2563eb;
    padding: 14px 18px;
    border-radius: 0 12px 12px 0;
    margin-bottom: 20px;
    font-size: calc(1.32rem * var(--font-scale));
    font-weight: 600;
    color: #334155;
  }

  .context-box strong {
    color: #1e3a8a;
    background: #dbeafe;
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 900;
  }

  /* 結構拆解積木區 */
  .breakdown-box {
    background: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .breakdown-label {
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
    color: #475569;
    margin-bottom: 12px;
  }

  .chunks-row {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 10px;
  }

  .syntax-chunk {
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    overflow: hidden;
    border: 2.5px solid #94a3b8;
    background: #fff;
    min-width: 96px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .syntax-chunk:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(15, 23, 42, 0.1);
  }

  .chunk-role {
    font-size: calc(0.98rem * var(--font-scale));
    font-weight: 900;
    padding: 5px 10px;
    border-bottom: 2px solid inherit;
    white-space: nowrap;
    position: relative;
  }

  .chunk-word {
    font-size: calc(1.65rem * var(--font-scale));
    font-weight: 900;
    padding: 10px 16px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 詞性遮蔽與語詞遮蔽狀態 */
  .syntax-chunk.masked-role .chunk-role {
    color: transparent !important;
    background: repeating-linear-gradient(45deg, #cbd5e1, #cbd5e1 8px, #94a3b8 8px, #94a3b8 16px) !important;
  }

  .syntax-chunk.masked-role .chunk-role::after {
    content: "❓ 點擊看詞性";
    color: #0f172a;
    font-size: 0.9rem;
    background: rgba(255, 255, 255, 0.92);
    padding: 1px 8px;
    border-radius: 6px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }

  .syntax-chunk.masked-word .chunk-word {
    color: transparent !important;
    background: #e2e8f0 !important;
  }

  .syntax-chunk.masked-word .chunk-word::after {
    content: "🔒 點擊看語詞";
    color: #1e40af;
    font-size: 1.05rem;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }

  .mask-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .mask-btn {
    padding: 7px 14px;
    border-radius: 10px;
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: 900;
    border: 2px solid #cbd5e1;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
    transition: all 0.15s;
  }

  .mask-btn:hover {
    border-color: #2563eb;
    background: #eff6ff;
  }

  .mask-btn.active {
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
  }

  .role-num { border-color: #3b82f6; }
  .role-num .chunk-role { background: #dbeafe; color: #1e40af; }
  .role-num .chunk-word { color: #1e3a8a; }

  .role-measure { border-color: #8b5cf6; }
  .role-measure .chunk-role { background: #ede9fe; color: #5b21b6; }
  .role-measure .chunk-word { color: #4c1d95; }

  .role-noun { border-color: #10b981; }
  .role-noun .chunk-role { background: #d1fae5; color: #065f46; }
  .role-noun .chunk-word { color: #064e3b; }

  .role-verb { border-color: #f59e0b; }
  .role-verb .chunk-role { background: #fef3c7; color: #92400e; }
  .role-verb .chunk-word { color: #78350f; }

  .role-adj { border-color: #ec4899; }
  .role-adj .chunk-role { background: #fce7f3; color: #9d174d; }
  .role-adj .chunk-word { color: #831843; }

  .role-part { border-color: #64748b; }
  .role-part .chunk-role { background: #e2e8f0; color: #334155; }
  .role-part .chunk-word { color: #1e293b; }

  .role-punct {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 900;
    color: #64748b;
    padding: 0 2px;
  }

  /* 緊接在句子結構下方的 3 個造句情境 */
  .practice-sub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin: 22px 0 14px;
    padding-top: 16px;
    border-top: 2px dashed #cbd5e1;
  }

  .practice-sub-title {
    font-size: calc(1.4rem * var(--font-scale));
    font-weight: 900;
    color: #0f172a;
  }

  .scenarios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }

  .scenario-card {
    background: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
  }

  .scenario-title {
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 900;
    color: #1e3a8a;
  }

  .scenario-prompt {
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 600;
    color: #334155;
  }

  .scenario-hint {
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 700;
    color: #0369a1;
    background: #e0f2fe;
    padding: 8px 12px;
    border-radius: 10px;
  }

  .ans-toggle-btn {
    background: #f59e0b;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: calc(1.15rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    width: 100%;
  }

  .ans-toggle-btn:hover {
    background: #d97706;
  }

  .ans-box {
    display: none;
    background: #ecfdf5;
    border: 2px solid #10b981;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 8px;
  }

  .ans-box.show {
    display: block;
  }

  .ans-main {
    font-size: calc(1.32rem * var(--font-scale));
    font-weight: 900;
    color: #064e3b;
    margin-bottom: 4px;
  }

  .ans-alt {
    font-size: calc(1.12rem * var(--font-scale));
    font-weight: 700;
    color: #047857;
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="goHome()">
    <span class="brand-badge">四上國語</span>
    <span class="brand-title">第七課～第十二課 短語與句型教學網</span>
  </div>
  <div class="toolbar">
    <button class="tool-btn" id="btn-home" onclick="goHome()" style="display:none;">🏠 返回課次首頁</button>
    <button class="tool-btn" onclick="adjustFontSize(-0.1)">A-</button>
    <button class="tool-btn" onclick="adjustFontSize(0)">標準字級</button>
    <button class="tool-btn" onclick="adjustFontSize(0.12)">A+</button>
    <button class="tool-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
  </div>
</header>

<main>
  <!-- 首頁：七到十二課選單 -->
  <section id="home-view">
    <div class="hero-banner">
      <h1>國語四上（第七冊）短語與句型教學網</h1>
      <p>標示課文自然段出處・拆解短語與句子結構・每句緊接 3 個情境造句練習與參考答案</p>
    </div>
    <div class="lesson-grid" id="lesson-grid"></div>
  </section>

  <!-- 課程單頁教學畫面（無複雜分頁，直接從上到下完整呈現） -->
  <section id="lesson-view">
    <div class="quick-bar">
      <div class="lesson-main-title" id="lesson-main-title">第七課《到此「藝」遊》</div>
      <div class="jump-links">
        <button class="jump-btn text-toggle" onclick="toggleFullText()">📖 展開／收合課文 1～7 自然段全文</button>
        <a class="jump-btn" href="#pattern-0">① 短語 1（第二段）</a>
        <a class="jump-btn" href="#pattern-1">② 短語 2（第七段）</a>
        <a class="jump-btn" href="#pattern-2">③ 句型 3（第六段）</a>
      </div>
    </div>

    <!-- 可收合的課文全文自然段對照 -->
    <div class="fulltext-drawer" id="fulltext-drawer"></div>

    <!-- 三大短語與句型（結構拆解 ＋ 3個情境造句直接連在一起） -->
    <div id="patterns-list-container"></div>
  </section>
</main>

<script>
const LESSONS = [
  {
    id: "L7",
    lessonNum: "第七課",
    title: "到此「藝」遊",
    author: "陳琡",
    subtitle: "自然段標示 ＋ 3 組短語句型結構拆解 ＋ 每句 3 個情境造句與參考答案",
    ready: true,
    paragraphs: [
      { num: "第一自然段", text: "終於到了戶外教育日！今天天空有點灰，但我的心情很晴朗，因為老師帶我們參觀宜蘭傳藝園區。", hl: false },
      { num: "第二自然段", text: "進入園區，我的眼睛為之一亮。街道旁是古色古香的磚紅色建築，<span class='hl-mark'>一個個紅燈籠，看起來喜氣洋洋。</span>", hl: true },
      { num: "第三自然段", text: "走進魯班街，街上的傳習所分別介紹陶器、玉石、藍染等藝術品，樣式獨特，令人目不轉睛。在燈光下，清透的琉璃閃著七彩光芒，讓我流連忘返。", hl: false },
      { num: "第四自然段", text: "接著，我們到劇場觀賞「噶瑪蘭公主」。一開場，演員們隨著音樂又唱又跳、翻跟斗，還有人走在細細的鋼索上，大家不禁為他捏一把冷汗。最難忘的，是演員揮舞半個舞臺大的赤紅色大旗時，有如一場熊熊烈火，精采的表演讓全場為他尖叫，真是有趣！", hl: false },

function renderHome() {
  const grid = document.getElementById("lesson-grid");
  grid.innerHTML = LESSONS.map(l => `
    <div class="lesson-card ${l.ready ? 'ready' : 'locked'}" onclick="${l.ready ? `openLesson('${l.id}')` : ''}">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="lesson-tag">${l.lessonNum}</span>
          <span class="status-pill ${l.ready ? 'ready' : 'soon'}">${l.ready ? '✅ 已上線' : '⏳ 待建立'}</span>
        </div>
        <div class="lesson-name">${l.title}</div>
        <div class="lesson-desc" style="margin-top:6px;">${l.subtitle}</div>

function openLesson(id) {
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson || !lesson.ready) return;

  document.getElementById("home-view").style.display = "none";
  document.getElementById("lesson-view").style.display = "block";
  document.getElementById("btn-home").style.display = "inline-flex";
  document.getElementById("lesson-main-title").textContent = `${lesson.lessonNum}《${lesson.title}》短語與句型教學`;

  // 渲染可收合的全文自然段對照
  const drawer = document.getElementById("fulltext-drawer");
  drawer.classList.remove("open");
  drawer.innerHTML = `
    <div style="font-size:calc(1.35rem * var(--font-scale));font-weight:900;color:#1e3a8a;margin-bottom:12px;">
      📖 第七課《到此「藝」遊》全文 7 個自然段位置對照（黃底為本課教學句）
    </div>
    ${lesson.paragraphs.map(p => `
      <div class="para-line ${p.hl ? 'has-hl' : ''}">
        <span class="para-num">${p.num}</span>
        <span>${p.text}</span>
      </div>
    `).join("")}
  `;

  // 渲染三大句型區塊（每個句型：自然段出處 ＋ 結構拆解 ＋ 3個情境練習直接連在一起）
  const container = document.getElementById("patterns-list-container");
  container.innerHTML = lesson.patterns.map((p, pIdx) => {
    const examplesHtml = p.examples.map(ex => {
      const chunksHtml = ex.chunks.map(c => {
        if (c.punct) return `<div class="role-punct">${c.punct}</div>`;
        return `
          <div class="syntax-chunk ${c.cls}" onclick="revealChunk(this)" title="點擊可單獨翻開此積木">
            <div class="chunk-role">${c.role}</div>
            <div class="chunk-word">${c.word}</div>
          </div>
        `;
      }).join("");
      return `
        <div class="breakdown-box">
          <div class="breakdown-label">${ex.label}</div>
          <div class="chunks-row">${chunksHtml}</div>
        </div>
      `;
    }).join("");

    const scenariosHtml = p.scenarios.map((sc, sIdx) => `
      <div class="scenario-card">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div class="scenario-title">✍️ ${sc.title}</div>
          <div class="scenario-prompt">${sc.prompt}</div>
          <div class="scenario-hint">${sc.hint}</div>
        </div>
        <div>
          <button class="ans-toggle-btn" id="btn-${pIdx}-${sIdx}" onclick="toggleAns(${pIdx}, ${sIdx})">
            ✨ 點擊看參考答案
          </button>
          <div class="ans-box" id="ans-${pIdx}-${sIdx}">
            <div class="ans-main">✅ ${sc.ansMain}</div>
            <div class="ans-alt">${sc.ansAlt}</div>
          </div>
        </div>
      </div>
    `).join("");

    return `
      <section class="pattern-section" id="pattern-${pIdx}">
        <div class="pattern-header">
          <div class="pattern-title-group">
            <span class="pattern-num-badge">${p.badge}</span>
            <span class="para-loc-badge">📍 ${p.paragraphLoc}</span>
          </div>
          <div class="formula-title">${p.formula}</div>
        </div>

        <div class="context-box">
          📖 <strong>課文段落原句：</strong>「${p.paragraphContext}」
        </div>

        <div class="mask-bar" id="mask-bar-${pIdx}">
          <span style="font-weight:900;color:#1e3a8a;font-size:calc(1.1rem * var(--font-scale));">🎭 課堂抽問遮罩：</span>
          <button class="mask-btn active" id="mask-none-${pIdx}" onclick="setSectionMask(${pIdx}, 'none')">👁 全部顯示</button>
          <button class="mask-btn" id="mask-role-${pIdx}" onclick="setSectionMask(${pIdx}, 'role')">❓ 遮住上方「詞性結構」</button>
          <button class="mask-btn" id="mask-word-${pIdx}" onclick="setSectionMask(${pIdx}, 'word')">🔒 遮住下方「例句語詞」</button>
          <span style="font-size:0.95rem;color:#64748b;font-weight:700;">（遮蔽後點擊任一彩色積木可單獨翻開）</span>
        </div>

        ${examplesHtml}

        <div class="practice-sub-header">
          <div class="practice-sub-title">🎯 隨堂造句情境練習（3 個情境）</div>
          <button class="jump-btn" onclick="toggleAllInPattern(${pIdx})">💡 展開／收合本句全部參考答案</button>

        <div class="scenarios-grid">
          ${scenariosHtml}

      </section>
    `;
  }).join("");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  document.getElementById("home-view").style.display = "block";
  document.getElementById("lesson-view").style.display = "none";
  document.getElementById("btn-home").style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleFullText() {
  document.getElementById("fulltext-drawer").classList.toggle("open");
}

function setSectionMask(pIdx, mode) {
  const section = document.getElementById(`pattern-${pIdx}`);
  if (!section) return;

  ["none", "role", "word"].forEach(m => {
    const btn = document.getElementById(`mask-${m}-${pIdx}`);
    if (btn) btn.classList.toggle("active", m === mode);
  });

  section.querySelectorAll(".syntax-chunk").forEach(chunk => {
    chunk.classList.remove("masked-role", "masked-word");
    if (mode === "role") chunk.classList.add("masked-role");
    if (mode === "word") chunk.classList.add("masked-word");
  });
}

function revealChunk(el) {
  el.classList.remove("masked-role", "masked-word");
}

function toggleAns(pIdx, sIdx) {
  const box = document.getElementById(`ans-${pIdx}-${sIdx}`);
  const btn = document.getElementById(`btn-${pIdx}-${sIdx}`);
  const show = box.classList.toggle("show");
  btn.textContent = show ? "🙈 隱藏參考答案" : "✨ 點擊看參考答案";
}

function toggleAllInPattern(pIdx) {
  const firstBox = document.getElementById(`ans-${pIdx}-0`);
  const targetShow = !firstBox.classList.contains("show");
  [0, 1, 2].forEach(sIdx => {
    const box = document.getElementById(`ans-${pIdx}-${sIdx}`);
    const btn = document.getElementById(`btn-${pIdx}-${sIdx}`);
    if (box && btn) {
      box.classList.toggle("show", targetShow);
      btn.textContent = targetShow ? "🙈 隱藏參考答案" : "✨ 點擊看參考答案";
    }
  });
}

function adjustFontSize(delta) {
  if (delta === 0) fontScale = 1;
  else fontScale = Math.min(1.4, Math.max(0.85, +(fontScale + delta).toFixed(2)));
  document.documentElement.style.setProperty("--font-scale", fontScale);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}

renderHome();
</script>
