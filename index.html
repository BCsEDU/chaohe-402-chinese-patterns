<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>國語短語與句型教學互動網（第七課～第十二課）</title>
<style>
  :root {
    --bg: #eef4fa;
    --surface: #ffffff;
    --surface-sub: #f8fafc;
    --primary: #1e40af;
    --primary-hover: #1d4ed8;
    --primary-light: #dbeafe;
    --accent: #d97706;
    --accent-light: #fef3c7;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --correct-bg: #dcfce7;
    --correct-border: #16a34a;
    --correct-text: #14532d;
    --wrong-bg: #fee2e2;
    --wrong-border: #dc2626;
    --wrong-text: #7f1d1d;
    --font-scale: 1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* 頂部導覽列 */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1e3a8a;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .brand-badge {
    background: #fbbf24;
    color: #1e3a8a;
    font-weight: 900;
    font-size: 1.15rem;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .brand-title {
    font-size: 1.55rem;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    padding: 8px 15px;
    border-radius: 10px;
    font-size: 1.08rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }

  .tool-btn.active {
    background: #fbbf24;
    color: #1e3a8a;
    border-color: #fbbf24;
  }

  main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 26px 24px 64px;
  }

  /* 首頁：課次選擇畫面 */
  #home-view {
    display: block;
  }

  .hero-banner {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    border-radius: 24px;
    padding: 34px 40px;
    margin-bottom: 30px;
    box-shadow: 0 12px 28px rgba(30, 64, 175, 0.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .hero-banner h1 {
    font-size: calc(2.3rem * var(--font-scale));
    font-weight: 900;
    margin-bottom: 8px;
  }

  .hero-banner p {
    font-size: calc(1.3rem * var(--font-scale));
    color: #dbeafe;
    font-weight: 600;
  }

  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
  }

  .lesson-card {
    background: var(--surface);
    border: 3px solid #cbd5e1;
    border-radius: 22px;
    padding: 28px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .lesson-card.ready {
    border-color: #3b82f6;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
  }

  .lesson-card.ready:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 32px rgba(30, 64, 175, 0.16);
    border-color: #1d4ed8;
  }

  .lesson-card.locked {
    background: #f1f5f9;
    border-style: dashed;
    opacity: 0.78;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .lesson-tag {
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 900;
    padding: 6px 16px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1e40af;
  }

  .lesson-card.locked .lesson-tag {
    background: #e2e8f0;
    color: #64748b;
  }

  .status-pill {
    font-size: 1.05rem;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 999px;
  }

  .status-pill.ready {
    background: #dcfce7;
    color: #15803d;
  }

  .status-pill.soon {
    background: #e2e8f0;
    color: #475569;
  }

  .lesson-name {
    font-size: calc(2rem * var(--font-scale));
    font-weight: 900;
    color: var(--text);
  }

  .lesson-desc {
    font-size: calc(1.18rem * var(--font-scale));
    color: var(--text-muted);
    font-weight: 600;
  }

  .feature-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .feature-chip {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.98rem;
    font-weight: 700;
  }

  .start-btn {
    margin-top: 6px;
    background: #1e40af;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 22px;
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s;
  }

  .lesson-card.ready:hover .start-btn {
    background: #1d4ed8;
  }

  .lesson-card.locked .start-btn {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
  }

  /* 課程主教學畫面 */
  #lesson-view {
    display: none;
  }

  /* 課堂模式切換分頁列 */
  .module-nav {
    background: var(--surface);
    border-radius: 20px;
    padding: 16px 22px;
    margin-bottom: 24px;
    border: 2.5px solid #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  }

  .module-lesson-title {
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 900;
    color: #1e3a8a;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .module-tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .module-tab-btn {
    padding: 12px 22px;
    border-radius: 14px;
    font-size: calc(1.22rem * var(--font-scale));
    font-weight: 900;
    border: 2.5px solid #cbd5e1;
    background: #f8fafc;
    color: #334155;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .module-tab-btn:hover {
    border-color: #3b82f6;
    color: #1e40af;
    background: #eff6ff;
  }

  .module-tab-btn.active {
    background: #1e40af;
    color: #fff;
    border-color: #1e3a8a;
    box-shadow: 0 6px 14px rgba(30, 64, 175, 0.25);
  }

  .tab-panel {
    display: none;
    animation: fadeIn 0.2s ease;
  }

  .tab-panel.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* =========================================
     分頁一：課文自然段定位與對照
     ========================================= */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }

  .target-summary-card {
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 18px;
    padding: 20px 22px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .target-summary-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.1);
  }

  .target-summary-card.type-1 { border-left: 10px solid #2563eb; }
  .target-summary-card.type-2 { border-left: 10px solid #059669; }
  .target-summary-card.type-3 { border-left: 10px solid #d97706; }

  .para-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 900;
    padding: 4px 14px;
    border-radius: 999px;
    width: fit-content;
  }

  .para-badge.p-blue { background: #dbeafe; color: #1e40af; }
  .para-badge.p-green { background: #d1fae5; color: #065f46; }
  .para-badge.p-amber { background: #fef3c7; color: #92400e; }

  .summary-pattern-title {
    font-size: calc(1.28rem * var(--font-scale));
    font-weight: 900;
    color: #0f172a;
  }

  .summary-sentence {
    font-size: calc(1.38rem * var(--font-scale));
    font-weight: 800;
    color: #1e3a8a;
    background: #f8fafc;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1.5px dashed #94a3b8;
  }

  .text-reader-box {
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 22px;
    padding: 30px 36px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
  }

  .reader-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 2px solid #e2e8f0;
  }

  .reader-title {
    font-size: calc(1.85rem * var(--font-scale));
    font-weight: 900;
    color: #0f172a;
  }

  .paragraph-row {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    padding: 18px 20px;
    border-radius: 16px;
    margin-bottom: 14px;
    border: 2px solid transparent;
    background: #f8fafc;
    transition: all 0.25s ease;
  }

  .paragraph-row.has-target {
    background: #fff;
    border-color: #cbd5e1;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
  }

  .paragraph-row.active-focus {
    border-color: #2563eb;
    background: #eff6ff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
  }

  .para-num-tag {
    flex-shrink: 0;
    background: #334155;
    color: #fff;
    font-weight: 900;
    font-size: calc(1.15rem * var(--font-scale));
    padding: 6px 14px;
    border-radius: 10px;
    min-width: 118px;
    text-align: center;
  }

  .paragraph-row.has-target .para-num-tag {
    background: #1e40af;
  }

  .para-content {
    font-size: calc(1.55rem * var(--font-scale));
    font-weight: 600;
    color: #1e293b;
    line-height: 1.75;
    flex: 1;
  }

  .target-highlight {
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s;
    display: inline;
  }

  .target-highlight.hl-1 {
    background: #dbeafe;
    color: #1e3a8a;
    border-bottom: 4px solid #2563eb;
  }

  .target-highlight.hl-2 {
    background: #d1fae5;
    color: #064e3b;
    border-bottom: 4px solid #059669;
  }

  .target-highlight.hl-3 {
    background: #fef3c7;
    color: #78350f;
    border-bottom: 4px solid #d97706;
  }

  .target-highlight:hover {
    filter: brightness(0.95);
  }

  .jump-analyze-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
    padding: 4px 12px;
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: 900;
    background: #1e40af;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    vertical-align: middle;
  }

  .jump-analyze-btn:hover {
    background: #1d4ed8;
  }

  /* =========================================
     分頁二 & 三：短語句型拆解 + 3情境造句
     ========================================= */
  .pattern-selector-bar {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .pattern-pill-btn {
    flex: 1;
    min-width: 260px;
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 18px;
    padding: 16px 20px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .pattern-pill-btn:hover {
    border-color: #60a5fa;
    background: #f8fafc;
  }

  .pattern-pill-btn.active {
    border-color: #1e40af;
    background: #eff6ff;
    box-shadow: 0 8px 20px rgba(30, 64, 175, 0.14);
  }

  .pill-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .pill-num {
    font-size: calc(1.1rem * var(--font-scale));
    font-weight: 900;
    color: #1e40af;
    background: #dbeafe;
    padding: 3px 12px;
    border-radius: 999px;
  }

  .pill-loc {
    font-size: calc(1rem * var(--font-scale));
    font-weight: 800;
    color: #b45309;
    background: #fef3c7;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .pill-formula {
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 900;
    color: #0f172a;
  }

  /* 拆解舞台卡片 */
  .stage-panel {
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 24px;
    padding: 30px 34px;
    margin-bottom: 26px;
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
  }

  .stage-header-bar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 2.5px solid #e2e8f0;
  }

  .formula-banner {
    font-size: calc(1.75rem * var(--font-scale));
    font-weight: 900;
    color: #1e3a8a;
    line-height: 1.4;
  }

  .context-quote-box {
    background: #f8fafc;
    border-left: 6px solid #2563eb;
    padding: 16px 20px;
    border-radius: 0 14px 14px 0;
    margin-bottom: 24px;
    font-size: calc(1.4rem * var(--font-scale));
    font-weight: 700;
    color: #334155;
  }

  .context-quote-box strong {
    color: #1e40af;
    background: #dbeafe;
    padding: 2px 6px;
    border-radius: 6px;
  }

  /* 結構積木拆解列 */
  .mask-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .mask-btn {
    padding: 10px 18px;
    border-radius: 12px;
    font-size: calc(1.12rem * var(--font-scale));
    font-weight: 900;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: #1e293b;
    cursor: pointer;
    transition: all 0.15s;
  }

  .mask-btn:hover {
    border-color: #2563eb;
    background: #eff6ff;
  }

  .mask-btn.active {
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
  }

  .example-block-card {
    background: #f8fafc;
    border: 2.5px solid #cbd5e1;
    border-radius: 20px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .example-label {
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 900;
    color: #475569;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chunks-row {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 12px;
  }

  .syntax-chunk {
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    overflow: hidden;
    border: 2.5px solid #94a3b8;
    background: #fff;
    min-width: 96px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
  }

  .syntax-chunk:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(15, 23, 42, 0.1);
  }

  .chunk-role {
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: 900;
    padding: 6px 12px;
    border-bottom: 2px solid inherit;
    white-space: nowrap;
  }

  .chunk-word {
    font-size: calc(1.85rem * var(--font-scale));
    font-weight: 900;
    padding: 14px 18px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .syntax-chunk.masked-role .chunk-role {
    color: transparent;
    background: repeating-linear-gradient(45deg, #cbd5e1, #cbd5e1 8px, #94a3b8 8px, #94a3b8 16px);
    position: relative;
  }
  .syntax-chunk.masked-role .chunk-role::after {
    content: "❓ 點擊看詞性";
    color: #0f172a;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.9);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .syntax-chunk.masked-word .chunk-word {
    color: transparent;
    background: #e2e8f0;
    position: relative;
  }
  .syntax-chunk.masked-word .chunk-word::after {
    content: "點我揭曉";
    color: #1e40af;
    font-size: 1.15rem;
    position: absolute;
  }

  /* 詞性配色 */
  .role-num { border-color: #3b82f6; }
  .role-num .chunk-role { background: #dbeafe; color: #1e40af; }
  .role-num .chunk-word { color: #1e3a8a; }

  .role-measure { border-color: #8b5cf6; }
  .role-measure .chunk-role { background: #ede9fe; color: #5b21b6; }
  .role-measure .chunk-word { color: #4c1d95; }

  .role-noun { border-color: #10b981; }
  .role-noun .chunk-role { background: #d1fae5; color: #065f46; }
  .role-noun .chunk-word { color: #064e3b; }

  .role-verb { border-color: #f59e0b; }
  .role-verb .chunk-role { background: #fef3c7; color: #92400e; }
  .role-verb .chunk-word { color: #78350f; }

  .role-adj { border-color: #ec4899; }
  .role-adj .chunk-role { background: #fce7f3; color: #9d174d; }
  .role-adj .chunk-word { color: #831843; }

  .role-part { border-color: #64748b; }
  .role-part .chunk-role { background: #e2e8f0; color: #334155; }
  .role-part .chunk-word { color: #1e293b; }

  .role-punct {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(2rem * var(--font-scale));
    font-weight: 900;
    color: #64748b;
    padding: 0 4px;
  }

  .analysis-note-box {
    background: #fffbeb;
    border: 2px solid #f59e0b;
    border-radius: 16px;
    padding: 18px 22px;
    margin-top: 16px;
  }

  .analysis-note-title {
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 900;
    color: #b45309;
    margin-bottom: 6px;
  }

  .analysis-note-body {
    font-size: calc(1.32rem * var(--font-scale));
    font-weight: 700;
    color: #1e293b;
  }

  /* 情境造句練習區（每個句型 3 個情境） */
  .scenarios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 22px;
    margin-top: 20px;
  }

  .scenario-card {
    background: #fff;
    border: 3px solid #cbd5e1;
    border-radius: 22px;
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
  }

  .scenario-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .scenario-badge {
    background: #1e40af;
    color: #fff;
    font-weight: 900;
    font-size: calc(1.1rem * var(--font-scale));
    padding: 5px 14px;
    border-radius: 999px;
  }

  .scenario-title {

let currentPatternIdx = 0;

let currentQIndex = 0;
let userQuizState = {};
let fontScale = 1;
let customSentences = JSON.parse(localStorage.getItem("chaohe_402_L7_sentences") || "{}");

function renderHome() {
  const grid = document.getElementById("lesson-grid");
  grid.innerHTML = LESSONS.map(lesson => `
    <div class="lesson-card ${lesson.ready ? 'ready' : 'locked'}"
         onclick="${lesson.ready ? `openLesson('${lesson.id}')` : ''}">
      <div>
        <div class="card-top">
          <span class="lesson-tag">${lesson.lessonNum}</span>
          <span class="status-pill ${lesson.ready ? 'ready' : 'soon'}">
            ${lesson.ready ? '✅ 已上線・教學互動完整版' : '⏳ 待建立'}
          </span>
        </div>
        <div class="lesson-name" style="margin-top:16px;">
          ${lesson.title}
          ${lesson.author ? `<span style="font-size:0.6em;color:#64748b;font-weight:700;margin-left:8px;">${lesson.author}</span>` : ''}
        </div>
        <div class="lesson-desc" style="margin-top:6px;">${lesson.subtitle}</div>
        <div class="feature-chips">
          ${(lesson.features || []).map(f => `<span class="feature-chip">${f}</span>`).join("")}
        </div>
      </div>
      <button class="start-btn" ${lesson.ready ? '' : 'disabled'}>
        ${lesson.ready ? '▶ 進入短語與句型互動教學' : '敬請期待'}
      </button>
    </div>
  `).join("");
}

function openLesson(lessonId) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson || !lesson.ready) return;
  currentLesson = lesson;
  currentPatternIdx = 0;
  maskMode = "none";
  currentQIndex = 0;
  userQuizState = {};

  document.getElementById("home-view").style.display = "none";
  document.getElementById("lesson-view").style.display = "block";
  document.getElementById("btn-home").style.display = "inline-flex";
  document.getElementById("btn-handout").style.display = "inline-flex";
  document.getElementById("current-lesson-heading").textContent = `${lesson.lessonNum}《${lesson.title}》短語與句型教學`;

  renderParagraphsTab();
  renderStructureTab();
  renderPracticeTab();
  renderQuizTab();
  switchTab("paragraphs");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  currentLesson = null;
  document.getElementById("home-view").style.display = "block";
  document.getElementById("lesson-view").style.display = "none";
  document.getElementById("btn-home").style.display = "none";
  document.getElementById("btn-handout").style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function switchTab(tabName) {
  currentTab = tabName;
  ["paragraphs", "structure", "practice", "quiz"].forEach(t => {
    document.getElementById(`tab-btn-${t}`).classList.toggle("active", t === tabName);
    document.getElementById(`panel-${t}`).classList.toggle("active", t === tabName);
  });
}

/* =========================================
   分頁 1：自然段對照與定位
   ========================================= */
function renderParagraphsTab() {
  const overviewEl = document.getElementById("target-overview-cards");
  overviewEl.innerHTML = currentLesson.patterns.map((p, idx) => `
    <div class="target-summary-card ${p.cardType}" onclick="focusParagraph(${p.paragraphNum}, ${idx})">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="para-badge ${p.badgeClass}">📍 對應課文：${p.paragraphLabel}</span>
        <span style="font-size:0.95rem;font-weight:800;color:#2563eb;">點擊定位課文 ⬇</span>
      </div>
      <div class="summary-pattern-title">${p.tag}：${p.formula}</div>
      <div class="summary-sentence">「${p.originalSentence}」</div>
    </div>
  `).join("");

  const parasEl = document.getElementById("paragraphs-container");
  parasEl.innerHTML = currentLesson.paragraphs.map(para => {
    const hasTarget = para.targetId !== null;
    const targetPattern = hasTarget ? currentLesson.patterns[para.targetId] : null;
    return `
      <div class="paragraph-row ${hasTarget ? 'has-target' : ''}" id="para-row-${para.num}">
        <div class="para-num-tag">
          ${para.label}
          ${hasTarget ? `<div style="font-size:0.82em;background:#fbbf24;color:#1e3a8a;border-radius:6px;padding:2px 6px;margin-top:4px;">★ ${targetPattern.tag}</div>` : ''}
        </div>
        <div class="para-content">${para.text}</div>
      </div>
    `;
  }).join("");
}

function focusParagraph(paraNum) {
  document.querySelectorAll(".paragraph-row").forEach(el => el.classList.remove("active-focus"));
  const targetRow = document.getElementById(`para-row-${paraNum}`);
  if (targetRow) {
    targetRow.classList.add("active-focus");
    targetRow.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function jumpToPattern(patternIdx) {
  currentPatternIdx = patternIdx;
  renderStructureTab();
  renderPracticeTab();
  switchTab("structure");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================================
   分頁 2：短語與句型結構拆解
   ========================================= */
function selectPattern(idx) {
  currentPatternIdx = idx;
  maskMode = "none";
  renderStructureTab();
  renderPracticeTab();
}

function setMaskMode(mode) {
  maskMode = (maskMode === mode) ? "none" : mode;
  renderStructureTab();
}

function toggleSingleChunk(el) {
  el.classList.remove("masked-role", "masked-word");
}

function renderPatternSelectorBar(containerId) {
  const bar = document.getElementById(containerId);
  bar.innerHTML = currentLesson.patterns.map((p, idx) => `
    <button class="pattern-pill-btn ${idx === currentPatternIdx ? 'active' : ''}" onclick="selectPattern(${idx})">
      <div class="pill-top">
        <span class="pill-num">${p.tag}</span>
        <span class="pill-loc">📍 ${p.paragraphLabel}</span>
      </div>
      <div class="pill-formula">${p.formula}</div>
    </button>
  `).join("");
}

function renderStructureTab() {
  renderPatternSelectorBar("structure-selector-bar");
  const p = currentLesson.patterns[currentPatternIdx];
  const stage = document.getElementById("structure-stage-content");

  const examplesHtml = p.examples.map((ex) => {
    const chunksHtml = ex.chunks.map((c) => {
      if (c.punct) {
        return `<div class="role-punct">${c.punct}</div>`;
      }
      let extraMask = "";
      if (maskMode === "role") extraMask = "masked-role";
      if (maskMode === "word") extraMask = "masked-word";
      return `
        <div class="syntax-chunk ${c.cls} ${extraMask}" onclick="toggleSingleChunk(this)" title="點擊可單獨翻開此積木">
          <div class="chunk-role">${c.role}</div>
          <div class="chunk-word">${c.word}</div>
        </div>
      `;
    }).join("");

    return `
      <div class="example-block-card">
        <div class="example-label">
          <span>${ex.title}</span>
          <span style="font-size:0.95rem;color:#64748b;">💡 點擊任一彩色詞語積木可單獨揭曉</span>
        </div>
        <div class="chunks-row">${chunksHtml}</div>
      </div>
    `;
  }).join("");

  stage.innerHTML = `
    <div class="stage-panel">
      <div class="stage-header-bar">
        <div>
          <span class="para-badge ${p.badgeClass}" style="margin-bottom:8px;">📍 出處：第七課・${p.paragraphLabel}</span>
          <div class="formula-banner">結構公式：${p.formula}</div>
        </div>
        <button class="ctrl-btn primary" onclick="switchTab('practice')">✍️ 前往此句型的 3 個情境造句 ➡</button>
      </div>

      <div class="context-quote-box">
        📖 <strong>課文${p.paragraphLabel}原文對照：</strong>「${p.paragraphContext}」
      </div>

      <div class="mask-controls">
        <span style="font-weight:900;font-size:calc(1.15rem * var(--font-scale));display:flex;align-items:center;color:#1e3a8a;">
          🎭 課堂抽問遮罩模式：
        </span>
        <button class="mask-btn ${maskMode === 'none' ? 'active' : ''}" onclick="setMaskMode('none')">👁 全部顯示</button>
        <button class="mask-btn ${maskMode === 'role' ? 'active' : ''}" onclick="setMaskMode('role')">❓ 遮住上方「詞性結構」（抽問詞性）</button>
        <button class="mask-btn ${maskMode === 'word' ? 'active' : ''}" onclick="setMaskMode('word')">🔒 遮住下方「例句語詞」（填空抽考）</button>
      </div>

      ${examplesHtml}

      <div class="analysis-note-box">
        <div class="analysis-note-title">👩‍🏫 教學拆解重點說明</div>
        <div class="analysis-note-body">${p.teachingNote}</div>
      </div>
    </div>
  `;
}

/* =========================================
   分頁 3：3×3 情境造句練習與參考答案
   ========================================= */
function renderPracticeTab() {
  renderPatternSelectorBar("practice-selector-bar");
  const p = currentLesson.patterns[currentPatternIdx];
  const stage = document.getElementById("practice-stage-content");

  const scenariosHtml = p.scenarios.map((sc, sIdx) => `
    <div class="scenario-card">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="scenario-header">
          <span class="scenario-badge">練習情境 ${sc.num}</span>
        </div>
        <div class="scenario-title">${sc.title}</div>
        <div class="scenario-prompt">🎬 <strong>情境引導：</strong>${sc.prompt}</div>
        <div class="vocab-hint-box">${sc.hint}</div>
      </div>

      <div>
        <button class="reveal-ans-btn" onclick="toggleScenarioAns(${sIdx})" id="ans-btn-${sIdx}">
          ✨ 點擊公佈參考答案
        </button>
        <div class="sample-answer-box" id="ans-box-${sIdx}" style="margin-top:12px;">
          <div class="sample-ans-label">✅ 參考造句範本：</div>
          <div class="sample-ans-main">${sc.answerMain}</div>
          <div class="sample-ans-alt">${sc.answerAlt}</div>
        </div>
      </div>
    </div>
  `).join("");

  const savedList = customSentences[p.index] || [];
  const savedHtml = savedList.length === 0
    ? `<div style="color:#64748b;font-weight:700;font-size:1.15rem;">目前尚無紀錄，老師可在上方輸入學生發表的佳句，即時投影展示！</div>`
    : savedList.map((text, i) => `
        <div class="live-item">
          <span>🌟 同學佳句 ${i + 1}：${text}</span>
          <button class="ctrl-btn" style="padding:6px 12px;font-size:1rem;" onclick="deleteCustomSentence(${p.index}, ${i})">刪除</button>
        </div>
      `).join("");

  stage.innerHTML = `
    <div class="stage-panel">
      <div class="stage-header-bar">
        <div>
          <span class="para-badge ${p.badgeClass}" style="margin-bottom:8px;">📍 對應課文：${p.paragraphLabel}</span>
          <div class="formula-banner">${p.tag}：${p.formula}</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="ctrl-btn reveal" onclick="revealAllScenarios(true)">💡 一鍵展開全部參考答案</button>
          <button class="ctrl-btn" onclick="revealAllScenarios(false)">🙈 全部收合</button>
        </div>
      </div>

      <div class="context-quote-box" style="margin-bottom:10px;">
        📌 <strong>課本範例句：</strong>「${p.originalSentence}」
      </div>

      <div class="scenarios-grid">
        ${scenariosHtml}
      </div>

      <!-- 課堂學生造句即時紀錄板 -->
      <div class="live-board-box">
        <div class="live-board-title">
          <span>📝 課堂互動白板：紀錄班上同學的造句（自動儲存於本機）</span>
        </div>
        <div class="live-input-row">
          <input type="text" class="live-input" id="live-sentence-input"
                 placeholder="在此輸入學生發表的造句，按 Enter 或點擊右側按鈕登上大螢幕..."
                 onkeydown="if(event.key==='Enter') addCustomSentence(${p.index})">
          <button class="ctrl-btn primary" onclick="addCustomSentence(${p.index})">➕ 登上佳句榜</button>
        </div>
        <div class="live-list" id="live-sentence-list">
          ${savedHtml}
        </div>
      </div>
    </div>
  `;
}

function toggleScenarioAns(sIdx) {
  const box = document.getElementById(`ans-box-${sIdx}`);
  const btn = document.getElementById(`ans-btn-${sIdx}`);
  const isShowing = box.classList.toggle("show");
  btn.textContent = isShowing ? "🙈 隱藏參考答案" : "✨ 點擊公佈參考答案";
}

function revealAllScenarios(show) {
  [0, 1, 2].forEach(sIdx => {
    const box = document.getElementById(`ans-box-${sIdx}`);
    const btn = document.getElementById(`ans-btn-${sIdx}`);
    if (box && btn) {
      box.classList.toggle("show", show);
      btn.textContent = show ? "🙈 隱藏參考答案" : "✨ 點擊公佈參考答案";
    }
  });
}

function addCustomSentence(patternIdx) {
  const input = document.getElementById("live-sentence-input");
  if (!input || !input.value.trim()) return;
  if (!customSentences[patternIdx]) customSentences[patternIdx] = [];
  customSentences[patternIdx].push(input.value.trim());
  localStorage.setItem("chaohe_402_L7_sentences", JSON.stringify(customSentences));
  renderPracticeTab();
}

function deleteCustomSentence(patternIdx, itemIdx) {
  if (!customSentences[patternIdx]) return;
  customSentences[patternIdx].splice(itemIdx, 1);
  localStorage.setItem("chaohe_402_L7_sentences", JSON.stringify(customSentences));
  renderPracticeTab();
}

/* =========================================
   分頁 4：五題隨堂小測驗
   ========================================= */
function renderQuizTab() {
  if (!currentLesson) return;
  const q = currentLesson.quiz[currentQIndex];
  const st = userQuizState[currentQIndex] || { selected: null, revealed: false };

  document.getElementById("quiz-category-badge").textContent = q.section;

  const dotsEl = document.getElementById("q-dots");
  dotsEl.innerHTML = currentLesson.quiz.map((item, idx) => {
    const s = userQuizState[idx];
    let cls = "q-dot";
    if (idx === currentQIndex) cls += " current";
    if (s && s.selected !== null) {
      cls += (s.selected === item.answer) ? " answered-correct" : " answered-wrong";
    } else if (s && s.revealed) {
      cls += " answered-correct";
    }
    return `<button class="${cls}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>`;
  }).join("");

  document.getElementById("stage-stem").innerHTML = `<span class="question-num-pill">第 ${currentQIndex + 1} 題</span>${q.stem}`;

  const optsEl = document.getElementById("stage-options");
  optsEl.innerHTML = q.options.map((optText, optIdx) => {
    let btnClass = "option-btn";
    if (st.revealed) {
      if (optIdx === q.answer) btnClass += " correct";
      else if (st.selected === optIdx) btnClass += " wrong";
    }
    return `
      <button class="${btnClass}" onclick="selectOption(${currentQIndex}, ${optIdx})">
        <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
        <span>${optText}</span>
      </button>
    `;
  }).join("");

  const expBox = document.getElementById("stage-exp");
  const expHeader = document.getElementById("stage-exp-header");
  const expBody = document.getElementById("stage-exp-body");

  if (st.revealed) {
    expBox.classList.add("show");
    if (st.selected === null) {
      expHeader.textContent = `💡 正確答案：${CIRCLED_NUMS[q.answer]}`;
    } else if (st.selected === q.answer) {
      expHeader.textContent = `🎉 答對了！正確答案是 ${CIRCLED_NUMS[q.answer]}`;
    } else {
      expHeader.textContent = `❌ 再想一想！正確答案是 ${CIRCLED_NUMS[q.answer]}`;
    }
    expBody.textContent = q.explanation;
  } else {
    expBox.classList.remove("show");
  }

  document.getElementById("btn-prev").disabled = (currentQIndex === 0);
  document.getElementById("btn-next").disabled = (currentQIndex === currentLesson.quiz.length - 1);
}

function selectOption(qIdx, optIdx) {
  userQuizState[qIdx] = { selected: optIdx, revealed: true };
  renderQuizTab();
}

function revealCurrentAnswer() {
  const prev = userQuizState[currentQIndex] || { selected: null, revealed: false };
  userQuizState[currentQIndex] = { selected: prev.selected, revealed: !prev.revealed };
  renderQuizTab();
}

function resetCurrentQuestion() {
  delete userQuizState[currentQIndex];
  renderQuizTab();
}

function resetAllQuestions() {
  userQuizState = {};
  renderQuizTab();
}

function jumpToQuestion(idx) {
  currentQIndex = idx;
  renderQuizTab();
}

function prevQuestion() {
  if (currentQIndex > 0) {
    currentQIndex--;
    renderQuizTab();
  }
}

function nextQuestion() {
  if (currentLesson && currentQIndex < currentLesson.quiz.length - 1) {
    currentQIndex++;
    renderQuizTab();
  }
}

function adjustFontSize(delta) {
  if (delta === 0) {
    fontScale = 1;
  } else {
    fontScale = Math.min(1.4, Math.max(0.85, +(fontScale + delta).toFixed(2)));
  }
  document.documentElement.style.setProperty("--font-scale", fontScale);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function toggleHandoutModal(show) {
  document.getElementById("handout-modal").classList.toggle("show", show);
}

// 鍵盤快捷鍵支援（當位於「五題隨堂小測驗」分頁時，支援 1~4 作答、左右鍵換題、空白鍵看解析）
window.addEventListener("keydown", (e) => {
  if (!currentLesson || currentTab !== "quiz") return;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown") {
    e.preventDefault();
    nextQuestion();
  } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
    e.preventDefault();
    prevQuestion();
  } else if (["1", "2", "3", "4"].includes(e.key)) {
    e.preventDefault();
    selectOption(currentQIndex, parseInt(e.key, 10) - 1);
  } else if (e.key === " ") {
    e.preventDefault();
    revealCurrentAnswer();
  }
});

renderHome();
</script>
</body>
</html>
